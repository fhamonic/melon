# Documentation site (Zensical, successor of Material for MkDocs).
# Preview locally with:  pip install zensical && zensical serve

[project]
site_name = "MELON"
site_description = "Header-only C++23 graph library — concept-based genericity, zero-cost views, LEMON-class performance."
site_url = "https://fhamonic.github.io/melon/"
repo_url = "https://github.com/fhamonic/melon"
repo_name = "fhamonic/melon"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
# MathJax: the config file must precede the library, which reads window.MathJax
# once at load and ignores anything set later.
extra_javascript = [
  "javascripts/benchmark-embed.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Why melon" = "getting-started/index.md" },
    { "Installation" = "getting-started/installation.md" },
    { "A first graph" = "getting-started/first-graph.md" },
    { "Coming from Boost.Graph or LEMON" = "getting-started/coming-from.md" },
  ] },
  { "The graph model" = [
    { "Graph concepts" = "graphs/concepts.md" },
    { "Mappings" = "graphs/mappings.md" },
    { "Undirected graphs" = "graphs/undirected-graphs.md" },
    { "Bringing your own graph" = "graphs/custom-graphs.md" },
  ] },
  { "Containers" = [
    { "Graph containers" = "containers/graphs.md" },
    { "Maps, heaps and sets" = "containers/data-structures.md" },
  ] },
  { "Views" = [
    { "Graph views" = "views/graphs.md" },
    { "Ownership and mapping views" = "views/ownership.md" },
  ] },
  { "Algorithms" = [
    { "Algorithms are ranges" = "algorithms/index.md" },
    { "Traversals and components" = "algorithms/traversals.md" },
    { "Shortest paths" = "algorithms/shortest-paths.md" },
    { "Flows and spanning trees" = "algorithms/flows-and-trees.md" },
    { "Combinatorial and geometric" = "algorithms/others.md" },
  ] },
  { "Performance" = "performance.md" },
  { "Reference" = [
    { "Customization points" = "reference/customization-points.md" },
    { "Concepts index" = "reference/concepts-index.md" },
    { "Header map" = "reference/headers.md" },
  ] },
]

[project.validation.links]
anchors = "warn"

[project.theme]
# Zensical's own look: Inter / JetBrains Mono, lucide icons.
variant = "modern"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

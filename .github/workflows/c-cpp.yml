name: C/C++ CI

on:
  push:
    branches: ["main"]
    # Release tags run the full matrix on the exact tagged commit, which may
    # not be the branch head the last main push validated.
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  # Source-level invariants, none of which any compiler enforces and all of
  # which fail silently: a header that only builds because another one included
  # the std header it needs, a test file that quietly stops exercising melon's
  # precondition asserts, and formatting drift.
  #
  # The checks needing no toolchain run first, and every step after the first
  # carries `if: !cancelled()` so one failure still reports the others -- steps
  # stop at the first failure by default, which would take two round-trips to
  # surface two independent problems.
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Every build job but the MSVC one uses libstdc++, whose <ranges> drags
      # in <bits/move.h>, <bits/stl_pair.h> and <type_traits>, so a header
      # missing <utility> or <type_traits> compiles across the whole matrix and
      # breaks in a consumer's translation unit instead. Only a source-level
      # check sees it.
      - name: "Every header includes what provides the std:: symbols it names"
        run: python3 misc/tools/check_std_includes.py include
      # melon's preconditions are asserts (contract Ruling 8), and a Release
      # build defines NDEBUG. Each test file re-enables them for itself before
      # including anything: <cassert> is designed to be re-included and
      # re-reads the macro each time, and melon being header-only that covers
      # the library code too. A file missing the line silently stops testing
      # every precondition it was written to check.
      - name: Every test file either undefines NDEBUG or opts out explicitly
        if: ${{ !cancelled() }}
        run: |
          missing=$(for f in test/*.cpp; do
                      head -8 "$f" \
                        | grep -qE '#undef NDEBUG|NDEBUG-INDEPENDENT' || echo "$f"
                    done)
          if [ -n "$missing" ]; then
            echo "These test files neither '#undef NDEBUG' nor carry the"
            echo "'NDEBUG-INDEPENDENT' marker, so their assertions vanish in a"
            echo "Release build:"
            echo "$missing"
            exit 1
          fi
      # Same pinned version as the one the tree is formatted with; a different
      # major version would flag different lines.
      - name: Install clang-format
        if: ${{ !cancelled() }}
        run: pipx install clang-format==18.1.8
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: |
          find include test -name "*.hpp" -o -name "*.cpp" \
            | xargs clang-format --dry-run -Werror

  linux-gcc15-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-15 an CMake
        run: apt-get install -y gcc-15 g++-15 cmake
      - name: Install Conan 2.0
        run: |
          apt install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Build and run unit tests
        run: |
          conan profile detect --name=default
          make CONAN_PROFILE=.github/conan-profiles/gcc15_c++26

  linux-gcc14-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-14 and CMake
        run: apt-get install -y gcc-14 g++-14 cmake
      - name: Install Conan 2.0
        run: |
          apt-get install -y pipx
          pipx install conan
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build and run unit tests
        run: |
          conan profile detect --name=default
          make CONAN_PROFILE=.github/conan-profiles/gcc14_c++23

  linux-clang18-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install Clang-18, libstdc++-14 and CMake
        run: apt-get install -y clang-18 libstdc++-14-dev cmake
      - name: Install Conan 2.0
        run: |
          apt-get install -y pipx
          pipx install conan
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Build and run unit tests
        run: |
          conan profile detect --name=default
          make CONAN_PROFILE=.github/conan-profiles/clang18_c++23

  # The regular jobs run plain Release; this one reruns the suite under
  # AddressSanitizer + UndefinedBehaviorSanitizer. It goes through the pure
  # CMake workflow, which also exercises the FetchContent GTest fallback.
  #
  # Debug, not Release: -O0 keeps ASan's reports precise and stops the
  # optimiser from eliding the very UB being hunted. The assertions are live
  # either way -- melon is header-only, so the `#undef NDEBUG` each test file
  # opens with covers every melon header that file includes, and the
  # source-hygiene job above enforces that it is there.
  linux-gcc15-sanitize:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-15 and CMake
        run: apt-get install -y gcc-15 g++-15 cmake
      # C++26 with MELON_PORTABLE_RANGE_SHAPES forces the C++23 concat
      # fallback although std::views::concat exists -- the option's whole
      # purpose -- so this job is the only one where both that combination
      # and the fallback itself run under the sanitizers.
      - name: Configure with ASan and UBSan
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=26 \
            -DMELON_PORTABLE_RANGE_SHAPES=ON \
            -DMELON_SANITIZE=address,undefined
      # A bare -j is unlimited for make: the 64 sanitized test TUs at ~1 GB
      # each got the whole step OOM-killed (exit 137) on the 16 GB runner.
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  cmake-submodule-test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-15 and CMake
        run: apt-get install -y gcc-15 g++-15 cmake
      - uses: actions/checkout@v7
        with:
          path: consumer/external/melon
      - name: Create a consumer project using melon as a submodule
        run: |
          cat > consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.12)
          project(MelonSubmoduleConsumer LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          add_subdirectory(external/melon)

          add_executable(melon_consumer main.cpp)
          target_link_libraries(melon_consumer PRIVATE melon)
          EOF
          cat > consumer/main.cpp << 'EOF'
          #include <iostream>

          #include "melon/algorithm/dijkstra.hpp"
          #include "melon/container/static_digraph.hpp"
          #include "melon/utility/static_digraph_builder.hpp"

          int main() {
              using namespace melon;

              static_digraph_builder<static_digraph, int> builder(6);
              builder.add_arc({0, 1}, 7)
                  .add_arc({0, 2}, 9)
                  .add_arc({0, 5}, 14)
                  .add_arc({1, 2}, 10)
                  .add_arc({1, 3}, 15)
                  .add_arc({2, 3}, 12)
                  .add_arc({2, 5}, 2)
                  .add_arc({3, 4}, 6)
                  .add_arc({4, 5}, 9);
              auto [graph, length_map] = builder.build();

              dijkstra alg(graph, length_map);
              alg.add_source(0u);
              for(const auto & [v, dist] : alg) {
                  std::cout << "vertex " << v << " at distance " << dist
                            << '\n';
              }
              return 0;
          }
          EOF
      - name: Configure, build and run the consumer project
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -S consumer -B consumer/build -DCMAKE_BUILD_TYPE=Release -DMELON_BUILD_TESTS=OFF
          cmake --build consumer/build
          ./consumer/build/melon_consumer

  # The submodule job above covers add_subdirectory; this one covers the other
  # non-Conan path: `cmake --install` into a prefix, then an out-of-tree
  # consumer that finds the installed package with find_package(melon CONFIG).
  # It is what proves melonConfig.cmake, the exported melon::melon target and
  # the installed header layout actually work together.
  linux-cmake-install:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-15 and CMake
        run: apt-get install -y gcc-15 g++-15 cmake
      # MELON_BUILD_TESTS defaults to PROJECT_IS_TOP_LEVEL, so it must be
      # turned off explicitly here: installing does not need the test suite,
      # and leaving it on would FetchContent-download GTest for nothing.
      - name: Install melon into a prefix
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DMELON_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/prefix"
          cmake --install build
      - name: Check the installed layout
        run: |
          test -f "$GITHUB_WORKSPACE/prefix/include/melon/version.hpp"
          test -f "$GITHUB_WORKSPACE/prefix/include/melon/all.hpp"
          test -f "$GITHUB_WORKSPACE/prefix/lib/cmake/melon/melonConfig.cmake"
          test -f "$GITHUB_WORKSPACE/prefix/lib/cmake/melon/melonConfigVersion.cmake"
          test -f "$GITHUB_WORKSPACE/prefix/lib/cmake/melon/melonTargets.cmake"
          test -f "$GITHUB_WORKSPACE/prefix/share/licenses/melon/LICENSE"
          # The two unfinished experimental headers must not ship.
          test ! -e "$GITHUB_WORKSPACE/prefix/include/melon/experimental/scapegoat_tree.hpp"
          test ! -e "$GITHUB_WORKSPACE/prefix/include/melon/experimental/doubly_connected_digraph.hpp"
      - name: Create an out-of-tree consumer using find_package(melon)
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(MelonInstallConsumer LANGUAGES CXX)
          find_package(melon 1.0 CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE melon::melon)
          EOF
          cat > consumer/main.cpp << 'EOF'
          #include <iostream>

          #include "melon/algorithm/dijkstra.hpp"
          #include "melon/container/static_digraph.hpp"
          #include "melon/utility/static_digraph_builder.hpp"
          #include "melon/version.hpp"

          static_assert(MELON_VERSION_MAJOR == 1);

          int main() {
              using namespace melon;

              static_digraph_builder<static_digraph, int> builder(6);
              builder.add_arc({0, 1}, 7)
                  .add_arc({0, 2}, 9)
                  .add_arc({0, 5}, 14)
                  .add_arc({1, 2}, 10)
                  .add_arc({1, 3}, 15)
                  .add_arc({2, 3}, 12)
                  .add_arc({2, 5}, 2)
                  .add_arc({3, 4}, 6)
                  .add_arc({4, 5}, 9);
              auto [graph, length_map] = builder.build();

              for(const auto & [v, dist] : dijkstra(graph, length_map, 0u)) {
                  std::cout << "vertex " << v << " at distance " << dist
                            << '\n';
              }
              return 0;
          }
          EOF
      - name: Build the consumer against the installed package
        run: |
          cmake -S consumer -B consumer/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build consumer/build -j"$(nproc)"
      # Dijkstra from vertex 0 settles the vertices in order of distance, so
      # the whole output is checked rather than a single line: that also
      # catches a regression in the traversal order.
      - name: Run the consumer and check its output
        run: |
          cat > expected.txt << 'EOF'
          vertex 0 at distance 0
          vertex 1 at distance 7
          vertex 2 at distance 9
          vertex 5 at distance 11
          vertex 3 at distance 21
          vertex 4 at distance 27
          EOF
          ./consumer/build/app | tee output.txt
          diff -u expected.txt output.txt

  # The other jobs run `conan build`, which never exercises the packaging half
  # of the recipe. This one runs `conan create` -- exporting, building, running
  # the suite and assembling the package -- then consumes the created package
  # from a separate project, which is the only way package() and package_info()
  # get checked.
  linux-conan-create:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    env:
      CC: gcc-15
      CXX: g++-15
    steps:
      - uses: actions/checkout@v7
      - name: Update APT
        run: apt-get update && apt-get upgrade -y
      - name: Install GCC-15 and CMake
        run: apt-get install -y gcc-15 g++-15 cmake
      - name: Install Conan 2.0
        run: |
          apt-get install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Create the package
        run: |
          conan profile detect --name=default
          conan create . -u -b=missing -pr=.github/conan-profiles/gcc15_c++26
      - name: Create a consumer project requiring the created package
        run: |
          mkdir -p consumer
          # Version range rather than a pinned 1.0.0, so the job keeps working
          # across patch bumps of version.hpp.
          cat > consumer/conanfile.txt << 'EOF'
          [requires]
          melon/[>=1.0 <2]

          [generators]
          CMakeDeps
          CMakeToolchain
          EOF
          cat > consumer/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.24)
          project(MelonConanConsumer LANGUAGES CXX)
          find_package(melon CONFIG REQUIRED)
          add_executable(app main.cpp)
          target_link_libraries(app PRIVATE melon::melon)
          EOF
          cat > consumer/main.cpp << 'EOF'
          #include <iostream>

          #include "melon/algorithm/dijkstra.hpp"
          #include "melon/container/static_digraph.hpp"
          #include "melon/utility/static_digraph_builder.hpp"
          #include "melon/version.hpp"

          static_assert(MELON_VERSION_MAJOR == 1);

          // The recipe's package() carries its own exclude list, separate from
          // the install() rules in CMakeLists.txt. Checking it here, against
          // the real include path of the created package, is what keeps the
          // two lists from drifting apart.
          #if __has_include("melon/experimental/scapegoat_tree.hpp")
          #error "scapegoat_tree.hpp is unfinished and must not be packaged"
          #endif
          #if __has_include("melon/experimental/doubly_connected_digraph.hpp")
          #error "doubly_connected_digraph.hpp is unfinished and must not be packaged"
          #endif
          #if !__has_include("melon/experimental/planar_map.hpp")
          #error "planar_map.hpp is expected to ship"
          #endif

          int main() {
              using namespace melon;

              static_digraph_builder<static_digraph, int> builder(6);
              builder.add_arc({0, 1}, 7)
                  .add_arc({0, 2}, 9)
                  .add_arc({0, 5}, 14)
                  .add_arc({1, 2}, 10)
                  .add_arc({1, 3}, 15)
                  .add_arc({2, 3}, 12)
                  .add_arc({2, 5}, 2)
                  .add_arc({3, 4}, 6)
                  .add_arc({4, 5}, 9);
              auto [graph, length_map] = builder.build();

              for(const auto & [v, dist] : dijkstra(graph, length_map, 0u)) {
                  std::cout << "vertex " << v << " at distance " << dist
                            << '\n';
              }
              return 0;
          }
          EOF
      - name: Build the consumer against the created package
        run: |
          conan install consumer -pr=.github/conan-profiles/gcc15_c++26 \
            -of=consumer/deps -b=missing
          cmake -S consumer -B consumer/build \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/consumer/deps/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer/build -j"$(nproc)"
      - name: Run the consumer and check its output
        run: |
          cat > expected.txt << 'EOF'
          vertex 0 at distance 0
          vertex 1 at distance 7
          vertex 2 at distance 9
          vertex 5 at distance 11
          vertex 3 at distance 21
          vertex 4 at distance 27
          EOF
          ./consumer/build/app | tee output.txt
          diff -u expected.txt output.txt

  windows-mingw15-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Conan 2.0
        run: pip install conan
      - name: Autodetect a default conan profile
        run: conan profile detect --name=default
      - name: Build and run unit tests
        run: make CONAN_PROFILE=.github/conan-profiles/mingw15_c++26

  windows-msvc17-11-build:
    # Not windows-latest: that image carries only Visual Studio 2026, and
    # both the "Visual Studio 17 2022" generator conan derives from
    # compiler.version=194 and the 14.41 toolset need a VS 2022 instance.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Install the MSVC 14.41 (VS 17.11) toolset
        # The runner image ships only the newest v14.4x toolset; the profile
        # pins 14.41 because it is melon's MSVC floor, so the side-by-side
        # toolset must be added. Exit code 3010 is success-needs-reboot.
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $proc = Start-Process -Wait -PassThru -FilePath "$installer\setup.exe" `
            -ArgumentList ('modify --installPath "' + $vs + '" ' +
              '--add Microsoft.VisualStudio.Component.VC.14.41.17.11.x86.x64 ' +
              '--quiet --norestart --nocache')
          if (($proc.ExitCode -ne 0) -and ($proc.ExitCode -ne 3010)) {
            throw "VS installer exited with $($proc.ExitCode)"
          }
      - name: Install Conan 2.0
        run: pip install conan
      - name: Autodetect a default conan profile
        run: conan profile detect --name=default
      - name: Build and run unit tests
        run: make CONAN_PROFILE=.github/conan-profiles/msvc17.11_c++23
